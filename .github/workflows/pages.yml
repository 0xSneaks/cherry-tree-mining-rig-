name: Deploy to GitHub Pages

# Hosting that needs no external account and no dashboard toggle.
#
# The game itself is entirely client-side: every figure on screen is read from
# Solana in the browser, and buy / claim / compound are signed by the user's
# own wallet. So a static host serves the whole mining loop.
#
# What a static host cannot serve is the launch-token backend (`/api/*`) and
# the server-rendered blink (`/inline`), which are dropped below. Both already
# require a CHERRY_APP_ID from Cherry registration, so nothing that works
# today is lost.
#
# Known limit: a static host cannot send headers, and `frame-ancestors` is
# ignored in a <meta> tag. Cherry's mobile WebView does not need it; Cherry
# *web* embeds in an iframe and does. This deployment therefore covers Seeker
# and standalone browsers, and Cherry web needs a header-capable host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `enablement: true` turns Pages on via the API, so this needs no
      # repository setting to be flipped by hand first.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install
        working-directory: app
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # Guard the honesty rules and the Rust/TypeScript agreement before
      # anything ships, rather than deploying whatever happens to compile.
      - name: Unit tests
        working-directory: app
        run: npx vitest run

      - name: Drop routes that require a server
        working-directory: app
        run: rm -rf src/app/api src/app/inline

      - name: Build static export
        working-directory: app
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Pages runs Jekyll otherwise, which eats the _next directory.
      - name: Disable Jekyll
        run: touch app/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
