name: Deploy to GitHub Pages

# Builds the static export and publishes it by pushing to the `gh-pages`
# branch, which GitHub serves directly.
#
# It does NOT use the Pages API (actions/configure-pages + deploy-pages):
# this repository's Actions token cannot be granted `pages: write`, so the
# API route fails with "Resource not accessible by integration". Pushing the
# branch needs only `contents: write` and works today.
#
# Why a static host is enough: the game is entirely client-side. Every figure
# on screen is read from Solana in the browser and every action is signed by
# the user's own wallet. What a static host cannot serve is the launch-token
# backend (`/api/*`) and the server-rendered blink (`/inline`), which are
# dropped below — both already require a CHERRY_APP_ID that does not exist
# yet, so nothing that works today is lost.
#
# Known limit: a static host cannot send headers, and `frame-ancestors` is
# ignored in a <meta> tag. Cherry's mobile WebView (the Seeker target) does
# not need it; Cherry *web* embeds in an iframe and does. So this covers
# Seeker and standalone browsers, and Cherry web wants a header-capable host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # Gate the deploy on the honesty rules and the Rust/TypeScript
      # fixture agreement, rather than shipping whatever compiles.
      - name: Unit tests
        working-directory: app
        run: npx vitest run

      - name: Drop routes that require a server
        working-directory: app
        run: rm -rf src/app/api src/app/inline

      - name: Build static export
        working-directory: app
        env:
          STATIC_EXPORT: '1'
          # Project Pages serve from /<repo>, so assets need the subpath.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Emit `_headers` alongside the build, from the same CSP the Node
      # deployment serves. GitHub Pages ignores it; Cloudflare Pages and
      # Netlify read it, so pointing either at this same build gives Cherry
      # web the `frame-ancestors` header it needs with no code change.
      - name: Emit static host headers
        working-directory: app
        run: npm run emit:headers

      # Pages runs Jekyll otherwise, which strips the _next directory and
      # every file whose name starts with an underscore, `_headers` included.
      - name: Disable Jekyll
        run: touch app/out/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd app/out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: static build of ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
