# Anchor CLI config.
#
# The program and its full test suite build and run WITHOUT the Anchor CLI or
# the SBF toolchain — see README "Testing without the SBF toolchain". This file
# is here for deploying to devnet once `anchor` and `solana` are installed.

[toolchain]
anchor_version = "0.31.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
sol_rigs = "CQKvfYNqD5Z2j7rPdXP1q3egWJZS43SdZNtyz6wRrJsv"

[programs.devnet]
sol_rigs = "CQKvfYNqD5Z2j7rPdXP1q3egWJZS43SdZNtyz6wRrJsv"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test --workspace"
