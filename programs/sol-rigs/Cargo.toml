[package]
name = "sol-rigs"
version = "0.1.0"
edition = "2021"
description = "SOL RIGS — fully-funded Solana mining simulation with SOL-denominated rewards"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_rigs"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.2", features = ["init-if-needed"] }
rigs-engine = { path = "../../crates/rigs-engine" }

[dev-dependencies]
solana-program-test = "2.3.13"
solana-sdk = "2.3.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
